<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car Search Harness</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="harness-shell">
      <header class="harness-header">
        <p class="eyebrow">Extension scaffold</p>
        <h1>Car Search Harness</h1>
      </header>

      <section class="panel-section" aria-labelledby="platforms-title">
        <h2 id="platforms-title">Platform</h2>
        <div id="platform-tabs" class="platform-tabs" role="tablist" aria-label="Search platforms"></div>
      </section>

      <section class="panel-section" aria-labelledby="tiers-title">
        <h2 id="tiers-title">Tiers</h2>
        <div id="tier-picker" class="tier-picker"></div>
      </section>

      <div id="tier-model-popover" class="tier-model-popover" hidden></div>

      <section class="panel-section" aria-labelledby="zip-title">
        <h2 id="zip-title">ZIP</h2>
        <label class="field">
          <span>Active ZIP</span>
          <input id="active-zip" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="10" placeholder="e.g. 56031" />
        </label>
        <p id="active-location-label" class="status-line">Marketplace location not set yet.</p>
        <div class="zip-actions">
          <button id="use-marketplace-location-button" class="secondary-button" type="button">Use Marketplace location</button>
        </div>
        <div id="recent-zips" class="chip-row" aria-label="Recent ZIPs"></div>
        <p id="zip-status-line" class="status-line" role="status"></p>
      </section>

      <section class="panel-section" aria-labelledby="controls-title">
        <h2 id="controls-title">Search Controls</h2>
        <div class="controls-grid">
          <label class="field">
            <span id="search-query-label">Query / model</span>
            <input id="search-query" type="text" autocomplete="off" value="hybrid" placeholder="e.g. hybrid" />
          </label>
          <label class="field platform-field platform-field--craigslist" data-platform-field="craigslist" hidden>
            <span>Craigslist site</span>
            <input id="craigslist-base-url" type="text" autocomplete="off" value="https://wausau.craigslist.org" placeholder="wausau.craigslist.org" />
          </label>
          <label class="field">
            <span>Min price</span>
            <input id="min-price" type="number" min="0" step="50" value="1500" />
          </label>
          <label class="field">
            <span>Max price</span>
            <input id="max-price" type="number" min="0" step="50" value="4000" />
          </label>
          <label class="field">
            <span>Min year</span>
            <input id="min-year" type="number" min="1900" step="1" value="2013" />
          </label>
          <label class="field">
            <span>Radius (miles)</span>
            <input id="radius" type="number" min="1" step="1" value="100" />
          </label>
          <label class="field platform-field platform-field--facebook" data-platform-field="facebook">
            <span>Days listed</span>
            <input id="days-listed" type="number" min="1" step="1" value="7" />
          </label>
          <label class="toggle-field platform-field platform-field--facebook" data-platform-field="facebook">
            <input id="exact-match" type="checkbox" checked />
            <span>Exact match</span>
          </label>
        </div>
        <p id="craigslist-search-note" class="status-line platform-field platform-field--craigslist" data-platform-field="craigslist" hidden>
          Craigslist URL uses site, ZIP, radius, price, year, and negative keywords. Optional keyword is only added when you type one.
        </p>
        <button id="search-button" class="search-button" type="button">Search Facebook</button>
        <p id="search-status" class="status-line" role="status"></p>
      </section>

      <section class="panel-section" aria-labelledby="saved-title">
        <h2 id="saved-title">Saved Cars</h2>

        <div id="listing-capture-box" class="listing-capture-box">
          <label class="field">
            <span>Drop or paste listing text/URL</span>
            <textarea id="listing-capture" class="listing-capture-textarea" rows="4" placeholder="Paste a Marketplace or Craigslist listing text block or URL here..."></textarea>
          </label>
          <div class="capture-actions">
            <button id="use-capture-button" class="secondary-button" type="button">Use Capture</button>
            <button id="clear-capture-button" class="secondary-button" type="button">Clear</button>
          </div>
          <p id="capture-status-line" class="status-line" role="status"></p>
        </div>

        <form id="saved-car-form" class="saved-car-form" novalidate>
          <input id="saved-car-id" type="hidden" />
          <button id="save-current-tab-button" class="secondary-button" type="button">Save current tab</button>
          <label class="field">
            <span>Title</span>
            <input id="saved-car-title" type="text" autocomplete="off" />
          </label>
          <label class="field">
            <span>URL</span>
            <input id="saved-car-url" type="url" autocomplete="off" />
          </label>
          <div class="controls-grid">
            <label class="field">
              <span>Price</span>
              <input id="saved-car-price" type="text" autocomplete="off" />
            </label>
            <label class="field">
              <span>Location</span>
              <input id="saved-car-location" type="text" autocomplete="off" />
            </label>
          </div>
          <div class="controls-grid">
            <label class="field">
              <span>Seller</span>
              <input id="saved-car-seller-name" type="text" autocomplete="off" />
            </label>
            <label class="field">
              <span>Mileage</span>
              <input id="saved-car-mileage" type="text" autocomplete="off" />
            </label>
          </div>
          <label class="field">
            <span>Status</span>
            <select id="saved-car-status"></select>
          </label>
          <label class="field">
            <span>Notes</span>
            <textarea id="saved-car-notes" rows="3"></textarea>
          </label>
          <div class="form-actions">
            <button id="save-car-button" class="search-button" type="submit">Save car</button>
            <button id="cancel-edit-button" class="secondary-button" type="button" hidden>Cancel edit</button>
          </div>
          <p id="saved-car-status-line" class="status-line" role="status"></p>
        </form>

        <div class="backup-controls">
          <button id="export-backup-button" class="secondary-button" type="button">Export Backup</button>
          <button id="import-backup-button" class="secondary-button" type="button">Import Backup</button>
          <input id="import-file-input" type="file" accept="application/json,.json" hidden />
        </div>

        <div class="repo-controls">
          <div id="repo-status" class="status-line"></div>
          <button id="choose-repo-button" class="secondary-button" type="button">Link Repository Folder</button>
          <button id="save-to-repo-button" class="secondary-button" type="button">Save to Repo</button>
          <button id="load-from-repo-button" class="secondary-button" type="button">Load from Repo</button>
          <input id="repo-folder-input" type="file" webkitdirectory hidden />
          <input id="repo-file-input" type="file" accept="application/json,.json" hidden />
        </div>

        <div class="saved-cars-list-controls" aria-label="Saved cars list options">
          <label class="field saved-cars-list-controls__field">
            <span>Sort by</span>
            <select id="saved-cars-sort">
              <option value="updated-desc">Recently updated</option>
              <option value="price-asc">Price (low → high)</option>
              <option value="price-desc">Price (high → low)</option>
              <option value="mileage-asc">Mileage (low → high)</option>
              <option value="mileage-desc">Mileage (high → low)</option>
              <option value="year-asc">Year (old → new)</option>
              <option value="year-desc">Year (new → old)</option>
            </select>
          </label>
          <label class="toggle-field saved-cars-list-controls__toggle">
            <input id="saved-cars-group-by-state" type="checkbox" checked />
            <span>Group by state</span>
          </label>
          <label class="toggle-field saved-cars-list-controls__toggle">
            <input id="saved-cars-favorites-only" type="checkbox" />
            <span>Favorites only</span>
          </label>
        </div>

        <div id="saved-cars-list" class="saved-cars-list" aria-live="polite"></div>
      </section>

      <section class="panel-section" aria-labelledby="preview-title">
        <h2 id="preview-title">Platform Result</h2>
        <code id="platform-result" class="result-box"></code>
      </section>
    </main>

    <script src="../shared/url-utils.js"></script>
    <script src="../shared/vehicles.js"></script>
    <script src="../shared/marketplace-location.js"></script>
    <script src="../shared/zip-geocode.js"></script>
    <script src="../shared/craigslist-exclusions.js"></script>
    <script src="../shared/craigslist.js"></script>
    <script src="../shared/platforms.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../shared/saved-car-utils.js"></script>
    <script src="../shared/saved-cars.js"></script>
    <script src="../shared/capture-parser.js"></script>
    <script src="../shared/listing-extractor.js"></script>
    <script src="../shared/listing-reader-client.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
